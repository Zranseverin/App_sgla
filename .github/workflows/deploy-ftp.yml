name: Deploiement FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Mettre a jour le serveur
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generer les fichiers statiques de production
        env:
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: 'static-build-only-not-used-in-production'
        run: |
          python -m pip install -r requirements.txt
          python manage.py collectstatic --noinput

      - name: Preparer le redemarrage Passenger
        run: |
          mkdir -p tmp
          date --utc +%FT%TZ > tmp/restart.txt

      - name: Envoyer les fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.venv/**
            **/venv/**
            **/__pycache__/**
            **/*.pyc
            **/.env
            **/*.sqlite3
            **/db.sqlite3
            **/media/**
            **/*.log
            **/.agents/**
            **/.http-forge/**
            **/.qodo/**
            documentation/**
            /faithtabernacle-reference.png
            /homepage-*.png
            /shiloh-*.png
            shiloh-*.env
            shiloh-*.css
