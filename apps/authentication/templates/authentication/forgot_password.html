<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mot de passe oublié | SGLA</title>
    <style>
        :root { --primary:#0e7c86; --dark:#075b63; --text:#183438; --muted:#667b7e; --danger:#b42318; }
        * { box-sizing:border-box; }
        body {
            min-height:100vh; margin:0; display:grid; place-items:center; padding:24px;
            color:var(--text); background:radial-gradient(circle at 10% 10%,#ccebed 0,transparent 34%),
            radial-gradient(circle at 90% 90%,#dcefee 0,transparent 32%),#f2f7f7;
            font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
        }
        .card { width:min(100%,460px); padding:38px; border:1px solid rgba(14,124,134,.14); border-radius:22px; background:#fff; box-shadow:0 24px 70px rgba(24,52,56,.13); }
        .brand { display:grid; place-items:center; width:48px; height:48px; margin-bottom:20px; border-radius:14px; color:#fff; background:var(--primary); font-weight:800; }
        h1 { margin:0 0 10px; font-size:1.75rem; }
        p { color:var(--muted); line-height:1.55; }
        label { display:block; margin:24px 0 7px; font-size:.9rem; font-weight:700; }
        input { width:100%; padding:13px 14px; border:1px solid #c9d7d8; border-radius:10px; outline:none; font:inherit; }
        input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(14,124,134,.12); }
        button { width:100%; margin-top:18px; padding:13px 18px; border:0; border-radius:10px; color:#fff; background:var(--primary); font:inherit; font-weight:750; cursor:pointer; }
        button:hover { background:var(--dark); }
        .error { margin-top:7px; color:var(--danger); font-size:.88rem; }
        .back { display:block; margin-top:22px; color:var(--dark); text-align:center; font-weight:700; text-decoration:none; }
        @media (max-width:480px) {
            body { padding:12px; }
            .card { padding:27px 20px; border-radius:17px; }
            h1 { font-size:1.5rem; }
            input { min-height:48px; font-size:16px; }
        }
    </style>
</head>
<body>
<main class="card">
    <div class="brand">SG</div>
    <h1>Mot de passe oublié ?</h1>
    <p>Indiquez l’adresse email associée à votre compte. Nous vous enverrons un lien sécurisé valable 24 heures.</p>
    <form method="post" novalidate>
        {% csrf_token %}
        <label for="{{ form.email.id_for_label }}">Adresse email</label>
        {{ form.email }}
        {% for error in form.email.errors %}<div class="error">{{ error }}</div>{% endfor %}
        <button type="submit">Envoyer le lien</button>
    </form>
    <a class="back" href="{% url 'authentication:connexion' %}">Retour à la connexion</a>
</main>
</body>
</html>
